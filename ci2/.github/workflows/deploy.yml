name: Implantar produção (configuração futura)

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Digest sha256 da imagem publicada pelo CI
        required: true
        type: string
      backup_confirmado:
        description: Servidor provisionado e plano de backup/restauração conferido
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: educafast-production
  cancel-in-progress: false

jobs:
  implantar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar configuração antes de contatar qualquer servidor
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmado }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BACKUP_CONFIRMED" == true ]] || { echo 'Confirme o plano de backup e o provisionamento.' >&2; exit 2; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Digest inválido.' >&2; exit 2; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Configure DEPLOY_HOST e DEPLOY_USER.' >&2; exit 2; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ && "$DEPLOY_PORT" -ge 1 && "$DEPLOY_PORT" -le 65535 ]] || exit 2
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_DIR" != / ]] || { echo 'Configure DEPLOY_DIR absoluto.' >&2; exit 2; }
          [[ "$PUBLIC_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ ]] || { echo 'Configure PUBLIC_URL com HTTPS.' >&2; exit 2; }
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Configure as credenciais SSH e a identidade conhecida do servidor.' >&2; exit 2; }
          umask 077
          mkdir -p "$RUNNER_TEMP/educafast-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/educafast-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/educafast-ssh/known_hosts"
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST"
          ssh -i "$RUNNER_TEMP/educafast-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/educafast-ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_DIR" "$image" "$PUBLIC_URL" < scripts/deploy-production.sh
