name: CD - Produção (manual)

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de uma execução aprovada do CI na main com imagem publicada
        required: true
        type: string
      backup_confirmado:
        description: Servidor provisionado, primeiro deploy e restauração conferidos
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: edufast-production
  cancel-in-progress: false

jobs:
  implantar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Conferir execução e proveniência da imagem
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python .github/cicd/verify_release.py
      - name: Usar configuração do mesmo commit testado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - name: Validar configuração e atualizar por SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_SHA: ${{ steps.release.outputs.commit }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmado }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash .github/cicd/remote.sh
