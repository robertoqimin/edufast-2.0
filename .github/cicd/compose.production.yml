name: edufast-production
services:
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy
  app:
    image: ${EDUFAST_IMAGE:?Defina imagem por digest publicada pelo CI}
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY}
      TRUSTED_HOSTS: ${DOMAIN:?Defina DOMAIN},localhost
      RELEASE_ID: ${EDUFAST_IMAGE}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-edufast}
      DB_USER: ${DB_USER:-edufast}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      UPLOAD_FOLDER: /app/uploads
    volumes: ["uploads_data:/app/uploads"]
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-edufast}
      APP_DB_USER: ${DB_USER:-edufast}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    configs:
      - source: postgres-app-role
        target: /docker-entrypoint-initdb.d/10-app-role.sh
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$APP_DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$APP_DB_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
networks:
  frontend: {}
  backend:
    internal: true
volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
configs:
  postgres-app-role:
    # Superusuario so administra o servidor; a aplicacao usa papel proprio, dono apenas do banco.
    content: |
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" -v app_db="$$POSTGRES_DB" <<'SQL'
      CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
      ALTER DATABASE :"app_db" OWNER TO :"app_user";
      REVOKE ALL ON DATABASE :"app_db" FROM PUBLIC;
      GRANT CONNECT, TEMPORARY ON DATABASE :"app_db" TO :"app_user";
      SQL
