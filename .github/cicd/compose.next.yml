# Standalone: nunca combinar com o Compose manual ou de produção.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: next-root-fixture-only
      POSTGRES_DB: edufast_next
      APP_DB_USER: next_ci
      APP_DB_PASSWORD: next-fixture-only
    configs:
      - source: postgres-app-role
        target: /docker-entrypoint-initdb.d/10-app-role.sh
    volumes: ["next_database:/var/lib/postgresql/data"]
    networks: [isolated]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$APP_DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$APP_DB_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
  tests:
    image: ${NEXT_TEST_IMAGE:?Use o executor next_stage.py}
    # Somente o executor de testes grava nos relatórios montados; produção continua sem root.
    user: "0:0"
    environment:
      EDUFAST_TEST_NEXT: "1"
      PYTHONPATH: /app:/next
      NEXT_BACKEND: ${NEXT_BACKEND:-sqlite}
      DB_URL: ${NEXT_DB_URL:-sqlite:///:memory:}
      APP_ENV: testing
      SECRET_KEY: next-test-secret-key-only-not-for-production
      UPLOAD_FOLDER: /tmp/next-uploads
      NEXT_DELIVERY: disabled
    volumes:
      - ./next:/next:ro
      - ${NEXT_REPORT_DIR:?Use o executor next_stage.py}:/reports
    tmpfs: ["/tmp"]
    working_dir: /next
    networks: [isolated]
    mem_limit: 768m
    cpus: 1
    entrypoint: ["python", "/next/run_suite.py"]
networks:
  isolated:
    internal: true
volumes:
  next_database:
configs:
  postgres-app-role:
    content: |
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" -v app_db="$$POSTGRES_DB" <<'SQL'
      CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
      ALTER DATABASE :"app_db" OWNER TO :"app_user";
      REVOKE ALL ON DATABASE :"app_db" FROM PUBLIC;
      GRANT CONNECT, TEMPORARY ON DATABASE :"app_db" TO :"app_user";
      SQL
